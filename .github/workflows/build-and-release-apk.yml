name: Build & Release JARVIS Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-and-release:
    name: Compile Android APK & Publish to Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug & Signed Release APKs
        working-directory: ./android
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare Distributable APK Artifacts
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/JARVIS-AI-Assistant-v2.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/JARVIS-AI-Assistant-Debug.apk
          ls -lh dist-apk/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Assistant-APK
          path: dist-apk/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "J.A.R.V.I.S. 2.0 Android Assistant APK (v2.0.0)"
          body: |
            ## J.A.R.V.I.S. 2.0 — Native Android Assistant (Kotlin + Jetpack Compose)
            ### Included in this Release:
            - **`JARVIS-AI-Assistant-v2.0.0.apk`** — Signed, ready-to-install Release APK for Android 8.0+ (API 26–35)
            - **`JARVIS-AI-Assistant-Debug.apk`** — Debug build with full telemetry logging
            - **Google Gemini AI Engine (`gemini-3.8-flash`)**: Conversational AI, code generation, and structured tool calling (`ASK_AI`, `OPEN_APP`, `OPEN_SETTINGS`, `GET_BATTERY`, `SET_VOLUME`, `CREATE_NOTE`)
            - **Hands-Free "Hey JARVIS" Voice Match & ElevenLabs (`dfsWmmgleAAdssZ0Spld`)**: Always-on wake-word verification and neural voice synthesis
          files: |
            dist-apk/JARVIS-AI-Assistant-v2.0.0.apk
            dist-apk/JARVIS-AI-Assistant-Debug.apk
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
